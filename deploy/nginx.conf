# ============================================
# Marketing Dashboard — Nginx (host) config
# ============================================
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/lkmarketing.online
#          sudo ln -s /etc/nginx/sites-available/lkmarketing.online /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# SSL:     sudo certbot --nginx -d lkmarketing.online
# ============================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Upstream — Next.js app on localhost:3000
upstream nextjs {
    server 127.0.0.1:3000;
}

# --- HTTP: redirect to HTTPS + ACME challenge ---
server {
    listen 80;
    server_name lkmarketing.online;

    # Let's Encrypt ACME challenge (managed by certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: main server ---
server {
    listen 443 ssl http2;
    server_name lkmarketing.online;

    # --- SSL certificates (will be managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/lkmarketing.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lkmarketing.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- Static assets cache (immutable hashed files) ---
    location /_next/static/ {
        proxy_pass http://nextjs;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # --- API rate limiting ---
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- All other requests ---
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
